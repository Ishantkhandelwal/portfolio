<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090b14" />
      <stop offset="100%" stop-color="#141829" />
    </linearGradient>
    <linearGradient id="ikGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="favGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Icon Container -->
  <rect width="64" height="64" rx="14" fill="url(#bgFav)" />
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />

  <!-- Monogram 'I' and 'K' in Cyber Data Aesthetic -->
  <g filter="url(#favGlow)">
    <!-- Letter 'I' -->
    <line x1="18" y1="18" x2="18" y2="46" stroke="url(#ikGrad)" stroke-width="5" stroke-linecap="round" />
    <circle cx="18" cy="18" r="2.5" fill="#ffffff" />
    <circle cx="18" cy="46" r="2.5" fill="#ffffff" />

    <!-- Letter 'K' Vertical Stem -->
    <line x1="32" y1="18" x2="32" y2="46" stroke="url(#ikGrad)" stroke-width="5" stroke-linecap="round" />

    <!-- Letter 'K' Upper Arm -->
    <line x1="33" y1="32" x2="48" y2="18" stroke="url(#ikGrad)" stroke-width="5" stroke-linecap="round" />
    <circle cx="48" cy="18" r="2.5" fill="#38bdf8" />

    <!-- Letter 'K' Lower Leg -->
    <line x1="33" y1="32" x2="48" y2="46" stroke="url(#ikGrad)" stroke-width="5" stroke-linecap="round" />
    <circle cx="48" cy="46" r="2.5" fill="#c084fc" />

    <!-- Central Telemetry Node -->
    <circle cx="32" cy="32" r="3.5" fill="#ffffff" />
  </g>
</svg>